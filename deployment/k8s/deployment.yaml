apiVersion: apps/v1
kind: Deployment
metadata:
  name: visionx-backend
  labels:
    app: visionx-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: visionx-backend
  template:
    metadata:
      labels:
        app: visionx-backend
    spec:
      containers:
        - name: backend
          image: visionx-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: visionx-config
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "4000m"
              memory: "8Gi"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: visionx-frontend
  labels:
    app: visionx-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: visionx-frontend
  template:
    metadata:
      labels:
        app: visionx-frontend
    spec:
      containers:
        - name: frontend
          image: visionx-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
